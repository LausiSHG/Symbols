<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symbols Demo</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      .wrap {
        max-width: 960px;
        margin: 48px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: #fff;
      }

      .symbol {
        color: var(--accent);
      }

      .name {
        font-size: 0.82rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="panel">
        <h1>Symbols Library Demo</h1>
        <div id="app"></div>
      </section>
    </main>

    <script type="module">
      import { listSymbols, renderSymbol } from '../src/index.js';

      const app = document.querySelector('#app');
      const names = listSymbols();

      app.innerHTML = `
        <div class="grid">
          ${names
            .map(
              (name) => `
                <div class="card">
                  ${renderSymbol(name, { className: 'symbol', size: 32, title: name })}
                  <div class="name">${name}</div>
                </div>
              `
            )
            .join('')}
        </div>
      `;
    </script>
  </body>
</html>
